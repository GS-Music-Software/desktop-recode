app-id: io.github.gs_music_software.desktop_recode
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: gs-music

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

modules:
  - name: gs-music
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
      env:
        CARGO_HOME: /run/build/gs-music/cargo
        npm_config_cache: /run/build/gs-music/npm-cache
        XDG_CACHE_HOME: /run/build/gs-music/cache
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - npm ci --prefer-offline
      - npm run build
      - cargo build --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/gs-music /app/bin/gs-music
      - install -Dm644 src-tauri/gs-music.desktop /app/share/applications/io.github.gs_music_software.desktop_recode.desktop
      - install -Dm644 src-tauri/io.github.gs_music_software.desktop_recode.metainfo.xml /app/share/metainfo/io.github.gs_music_software.desktop_recode.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.gs_music_software.desktop_recode.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.gs_music_software.desktop_recode.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.gs_music_software.desktop_recode.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/256x256/apps/io.github.gs_music_software.desktop_recode.png
    sources:
      - type: git
        url: https://github.com/GS-Music-Software/desktop-recode.git
        commit: 911d72da7f6fc3661cf9a44e7816b4d3af67874e
      - cargo-sources.json
      - node-sources.json
