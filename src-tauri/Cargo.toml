[package]
name = "gs-music"
version = "1.0.0"
edition = "2021"

[lib]
name = "gs_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gs-music"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "net"] }
sha2 = "0.10"
rand = "0.8"
dirs = "6"
discord-rich-presence = "1"
zip = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
